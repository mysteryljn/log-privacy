name: Bug report
description: 报告可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤和输入
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      required: true
